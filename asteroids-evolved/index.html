<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids Evolved</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #0ff;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px #0ff;
      font-size: 16px;
      letter-spacing: 2px;
    }
    #canvas {
      display: block;
      cursor: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      z-index: 20;
    }
    #overlay h1 {
      font-size: 52px;
      letter-spacing: 6px;
      color: #0ff;
      text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
      margin-bottom: 12px;
    }
    #overlay .subtitle {
      font-size: 14px;
      color: #0ff8;
      letter-spacing: 3px;
      margin-bottom: 40px;
    }
    #overlay .controls-grid {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 24px;
      font-size: 14px;
      color: #0ffa;
      margin-bottom: 40px;
      text-align: left;
    }
    #overlay .controls-grid span:nth-child(odd) { color: #ff0; text-shadow: 0 0 6px #ff0; }
    #overlay .start-btn {
      font-family: inherit;
      font-size: 18px;
      letter-spacing: 4px;
      background: none;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 12px 40px;
      cursor: pointer;
      text-shadow: 0 0 8px #0ff;
      box-shadow: 0 0 16px #0ff4, inset 0 0 16px #0ff1;
      transition: all 0.2s;
    }
    #overlay .start-btn:hover {
      background: #0ff2;
      box-shadow: 0 0 32px #0ff8, inset 0 0 32px #0ff2;
    }
    #overlay .hi-score {
      margin-top: 24px;
      font-size: 12px;
      color: #0ff6;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div id="hud">
  <span id="score-display">SCORE: 0</span>
  <span id="wave-display">WAVE 1</span>
  <span id="lives-display">♦ ♦ ♦</span>
</div>

<canvas id="canvas"></canvas>

<div id="overlay">
  <h1>ASTEROIDS</h1>
  <div class="subtitle">E V O L V E D</div>
  <div class="controls-grid">
    <span>← →</span><span>Rotate</span>
    <span>↑</span><span>Thrust</span>
    <span>SPACE</span><span>Fire</span>
    <span>P</span><span>Pause</span>
  </div>
  <button class="start-btn" id="start-btn">LAUNCH</button>
  <div class="hi-score" id="hi-score-display"></div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
