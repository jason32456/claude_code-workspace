<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon Snake 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 20px; left: 20px; color: #0f0;
      text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
      font-size: 18px; pointer-events: none;
    }
    #hud .label { color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
    #hud .value { font-size: 32px; font-weight: bold; margin-bottom: 12px; }
    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #333; font-size: 11px; text-align: center; pointer-events: none;
      letter-spacing: 1px;
    }
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(0,0,0,0.85);
      color: #0f0; text-align: center;
    }
    #overlay h1 {
      font-size: 64px; font-weight: 900; letter-spacing: 6px;
      text-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 80px #0f0;
      margin-bottom: 8px;
    }
    #overlay .subtitle {
      font-size: 14px; letter-spacing: 4px; color: #555; margin-bottom: 40px;
    }
    #overlay .score-display { font-size: 20px; color: #f0f; margin-bottom: 8px;
      text-shadow: 0 0 10px #f0f; }
    #overlay .final-score { font-size: 48px; font-weight: bold; color: #f0f;
      text-shadow: 0 0 20px #f0f, 0 0 40px #f0f; margin-bottom: 40px; }
    #overlay button {
      background: transparent; border: 2px solid #0f0; color: #0f0;
      font-family: 'Courier New', monospace; font-size: 16px;
      letter-spacing: 4px; padding: 14px 40px; cursor: pointer;
      text-shadow: 0 0 10px #0f0; box-shadow: 0 0 20px rgba(0,255,0,0.3);
      transition: all 0.2s;
    }
    #overlay button:hover {
      background: rgba(0,255,0,0.1); box-shadow: 0 0 40px rgba(0,255,0,0.5);
    }
    #overlay .hint {
      margin-top: 20px; font-size: 12px; color: #333; letter-spacing: 2px;
    }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
    <div class="label">Length</div>
    <div class="value" id="length">1</div>
  </div>
  <div id="controls">WASD · Move &nbsp;|&nbsp; Q · Up &nbsp;|&nbsp; E · Down &nbsp;|&nbsp; ARROWS · Turn</div>

  <div id="overlay">
    <h1>SNAKE 3D</h1>
    <div class="subtitle">NEON EDITION</div>
    <div id="final-score-wrap" style="display:none">
      <div class="score-display">FINAL SCORE</div>
      <div class="final-score" id="final-score">0</div>
    </div>
    <button id="start-btn">PLAY</button>
    <div class="hint">WASD + Q/E to move in 3D</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
