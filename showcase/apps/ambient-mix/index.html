<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient Mix</title>
  <meta name="description" content="Ten-channel ambient mixer">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23b6ff3d' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%23b6ff3d'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Ambient Mix</h1>
      <p class="subtitle">Create your perfect soundscape</p>
    </header>

    <div class="main-content">
      <div class="left-panel">
        <section class="sound-library">
          <h2>Sound Library</h2>
          <div class="sounds-grid" id="soundsGrid"></div>
        </section>
      </div>

      <div class="right-panel">
        <section class="mixer-section">
          <div class="mixer-header">
            <h2>Your Mix</h2>
            <div class="mixer-controls">
              <button id="playBtn" class="btn-primary">▶ Play</button>
              <button id="stopBtn" class="btn-secondary" disabled>⏸ Stop</button>
            </div>
          </div>

          <div class="mixer-panel" id="mixerPanel">
            <p class="empty-state">Drag sounds here to create your mix</p>
          </div>

          <div class="master-control">
            <label>Master Volume</label>
            <div class="slider-container">
              <input type="range" id="masterVolume" min="0" max="100" value="70">
              <span id="masterLabel">70%</span>
            </div>
          </div>

          <div class="actions">
            <input type="text" id="mixName" placeholder="Mix name..." maxlength="30">
            <button id="saveMixBtn" class="btn-secondary">💾 Save Mix</button>
          </div>
        </section>

        <section class="presets-section">
          <h2>Saved Mixes</h2>
          <div id="savedMixes" class="saved-mixes-list">
            <p class="empty-state">No saved mixes yet</p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
