<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatful: fair name drawing</title>
<meta name="description" content="Secret Santa style name drawing with a provably uniform draw. No server, no accounts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='5' width='18' height='17' rx='3' fill='%231f5c4a'/%3E%3Crect x='3' y='21' width='26' height='6' rx='3' fill='%231f5c4a'/%3E%3Crect x='7' y='15' width='18' height='3.5' fill='%23d9a441'/%3E%3C/svg%3E">
<script>try{var q=new URLSearchParams(location.search).get('theme');var t=(q==='dark'||q==='light')?q:localStorage.getItem('hatful.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#stage">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="brand-icon"></span><span class="brand-word">Hatful</span></div>
    <label class="title-field">
      <span class="sr-only">Event title</span>
      <input id="event-title" type="text" maxlength="60" placeholder="Name your event" autocomplete="off">
    </label>
    <div class="top-actions">
      <button id="theme-toggle" type="button" class="icon-btn round" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
      </button>
      <div class="menu">
        <button id="menu-btn" type="button" class="icon-btn round" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-panel">⋯</button>
        <div id="menu-panel" role="menu" hidden></div>
      </div>
    </div>
  </div>
  <nav class="steps-nav" aria-label="Steps"><ol id="steps" class="steps"></ol></nav>
</header>
<main id="stage" tabindex="-1"></main>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Hatful needs JavaScript to run. Nothing is sent anywhere.</p></noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
