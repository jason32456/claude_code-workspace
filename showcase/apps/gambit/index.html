<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gambit — chess &amp; tactics trainer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Gambit<span class="crown" aria-hidden="true">♞</span></h1>
    <nav class="mode-tabs" role="tablist" aria-label="Mode">
      <button class="mode-tab active" data-mode="play" role="tab" aria-selected="true">Play</button>
      <button class="mode-tab" data-mode="puzzle" role="tab" aria-selected="false">Puzzle Rush</button>
    </nav>
    <button id="soundToggle" class="icon-btn" title="Toggle sound" aria-pressed="false">🔊</button>
  </header>

  <main>
    <!-- ===================== PLAY MODE ===================== -->
    <section id="playView" class="view active">
      <div class="board-column">
        <div class="player-strip" id="topPlayerStrip">
          <span class="player-label" id="topPlayerLabel">Black</span>
          <div class="captured-tray" id="capturedByWhite"></div>
        </div>

        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Chess board"></div>
          <div id="promoPicker" class="promo-picker hidden"></div>
        </div>

        <div class="player-strip" id="bottomPlayerStrip">
          <span class="player-label" id="bottomPlayerLabel">White</span>
          <div class="captured-tray" id="capturedByBlack"></div>
        </div>

        <p id="statusLine" class="status-line" aria-live="polite">White to move</p>
      </div>

      <aside class="side-panel">
        <div class="panel-block">
          <h2>Opponent</h2>
          <div class="btn-group" id="opponentSelect">
            <button class="opt-btn active" data-opponent="human">Human</button>
            <button class="opt-btn" data-opponent="ai">Computer</button>
          </div>
          <div class="btn-group" id="difficultySelect">
            <button class="opt-btn" data-difficulty="easy">Easy</button>
            <button class="opt-btn active" data-difficulty="medium">Medium</button>
            <button class="opt-btn" data-difficulty="hard">Hard</button>
          </div>
        </div>

        <div class="panel-block">
          <h2>Moves</h2>
          <ol id="moveList" class="move-list" aria-label="Move list"></ol>
        </div>

        <div class="panel-block controls-row">
          <button id="newGameBtn" class="btn">New game</button>
          <button id="undoBtn" class="btn">Undo</button>
          <button id="flipBtn" class="btn">Flip board</button>
          <button id="resignBtn" class="btn btn-danger">Resign</button>
        </div>
      </aside>
    </section>

    <!-- ===================== PUZZLE RUSH MODE ===================== -->
    <section id="puzzleView" class="view">
      <div class="board-column">
        <div class="puzzle-hud">
          <div class="hud-stat">
            <span class="hud-label">Time</span>
            <span class="hud-value" id="puzzleTimer">0:00</span>
          </div>
          <div class="hud-stat">
            <span class="hud-label">Solved</span>
            <span class="hud-value" id="puzzleSolved">0</span>
          </div>
          <div class="hud-stat">
            <span class="hud-label">Lives</span>
            <span class="hud-value" id="puzzleLives">♥ ♥ ♥</span>
          </div>
          <div class="hud-stat">
            <span class="hud-label">Best streak</span>
            <span class="hud-value" id="puzzleBest">0</span>
          </div>
        </div>

        <div class="board-wrap">
          <div id="puzzleBoard" class="board" role="grid" aria-label="Puzzle board"></div>
        </div>

        <p id="puzzleStatusLine" class="status-line" aria-live="polite">Pick a difficulty to begin</p>
      </div>

      <aside class="side-panel">
        <div class="panel-block" id="puzzleIntro">
          <h2>Difficulty</h2>
          <div class="btn-group" id="puzzleDifficultySelect">
            <button class="opt-btn" data-difficulty="easy">Easy</button>
            <button class="opt-btn active" data-difficulty="medium">Medium</button>
            <button class="opt-btn" data-difficulty="hard">Hard</button>
          </div>
          <button id="startPuzzleBtn" class="btn btn-primary">Start Puzzle Rush</button>
          <p class="hint-text">Find the best move. Three wrong answers ends the run.</p>
        </div>

        <div class="panel-block hidden" id="puzzleThemeBlock">
          <h2>Theme</h2>
          <p id="puzzleTheme" class="theme-line">—</p>
          <button id="hintBtn" class="btn">Show hint</button>
          <p id="hintText" class="hint-text hidden"></p>
        </div>

        <div class="panel-block hidden" id="puzzleSummaryBlock">
          <h2>Run complete</h2>
          <p id="puzzleSummaryText"></p>
          <button id="puzzleRestartBtn" class="btn btn-primary">Try again</button>
        </div>
      </aside>
    </section>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle">Game over</h2>
      <p id="modalBody"></p>
      <button id="modalCloseBtn" class="btn btn-primary">Close</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
