<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Timber!</title>
  <meta name="description" content="One-more-go arcade chopper" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23ff3db5' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%23ff3db5'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="420" height="720"></canvas>

    <div id="overlay" class="overlay">
      <div class="card">
        <h1>TIMBER<span class="bang">!</span></h1>
        <p class="tag">Chop the endless tree — dodge the branches.</p>
        <div class="how">
          <div><kbd>A</kbd> / <kbd>&larr;</kbd> chop left</div>
          <div><kbd>D</kbd> / <kbd>&rarr;</kbd> chop right</div>
          <div class="muted">or tap the left / right side of the screen</div>
        </div>
        <button id="startBtn">PLAY</button>
        <p class="best" id="bestLine"></p>
      </div>
    </div>

    <div id="gameover" class="overlay hidden">
      <div class="card">
        <h2 id="goTitle">SQUASHED</h2>
        <p class="score-line">Score <span id="finalScore">0</span></p>
        <p class="best" id="finalBest"></p>
        <button id="retryBtn">GO AGAIN</button>
        <p class="muted">Space / tap to retry</p>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
