<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Timber!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="420" height="720"></canvas>

    <div id="overlay" class="overlay">
      <div class="card">
        <h1>TIMBER<span class="bang">!</span></h1>
        <p class="tag">Chop the endless tree — dodge the branches.</p>
        <div class="how">
          <div><kbd>A</kbd> / <kbd>&larr;</kbd> chop left</div>
          <div><kbd>D</kbd> / <kbd>&rarr;</kbd> chop right</div>
          <div class="muted">or tap the left / right side of the screen</div>
        </div>
        <button id="startBtn">PLAY</button>
        <p class="best" id="bestLine"></p>
      </div>
    </div>

    <div id="gameover" class="overlay hidden">
      <div class="card">
        <h2 id="goTitle">SQUASHED</h2>
        <p class="score-line">Score <span id="finalScore">0</span></p>
        <p class="best" id="finalBest"></p>
        <button id="retryBtn">GO AGAIN</button>
        <p class="muted">Space / tap to retry</p>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
