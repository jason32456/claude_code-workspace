<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heard</title>
  <meta name="description" content="Plan a whole meal backwards from serving time — hands, burners and oven temperatures scheduled — then cook it with live calls.">
  <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M14 22h22M14 32h36M14 42h16' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='42' r='5' fill='%23fbbf24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mobile="timeline">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="word">Heard</span>
    </div>
    <label class="menu-name">
      <span class="sr">Menu name</span>
      <input id="menu-name" maxlength="40" aria-label="Menu name">
    </label>
    <label class="serve">
      <span>Serve at</span>
      <input id="serve" type="time" step="300" aria-label="Serving time">
    </label>
    <div class="top-actions">
      <select id="preset" aria-label="Load a preset menu"></select>
      <button id="btn-share" class="btn ghost sm" title="Copy a link that carries this whole menu">Share</button>
      <button id="btn-theme" class="btn ghost sm icon-btn" aria-label="Toggle dark mode"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
      <button id="btn-cook" class="btn primary">Start cooking</button>
    </div>
  </header>

  <main class="layout">
    <section class="col left" aria-label="Kitchen and menu">
      <div class="card">
        <div class="card-head"><h2>Kitchen</h2><span class="muted small">what you have to work with</span></div>
        <div id="kitchen" class="kitchen"></div>
      </div>
      <div class="card grow">
        <div class="card-head">
          <h2>Menu <span id="dish-count" class="count"></span></h2>
          <div class="add-dish">
            <select id="add-dish" aria-label="Add a dish"></select>
          </div>
        </div>
        <div id="dishes" class="dishes"></div>
      </div>
    </section>

    <section class="col right" aria-label="Plan">
      <div id="stats" class="stats"></div>
      <nav class="tabs" role="tablist">
        <button data-tab="timeline" role="tab">Timeline</button>
        <button data-tab="sheet" role="tab">Run sheet</button>
        <button data-tab="insights" role="tab">Insights <span id="issue-badge" class="badge" hidden></span></button>
      </nav>
      <div id="tab-timeline" role="tabpanel" class="card pad-0"></div>
      <div id="tab-sheet" role="tabpanel" class="card" hidden></div>
      <div id="tab-insights" role="tabpanel" hidden></div>
    </section>
  </main>

  <nav class="mobile-tabs" aria-label="Sections">
    <button data-m="menu">Menu</button>
    <button data-m="timeline">Timeline</button>
    <button data-m="sheet">Run sheet</button>
    <button data-m="insights">Insights</button>
  </nav>

  <section id="cook" class="cook" hidden aria-label="Cook mode"></section>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
