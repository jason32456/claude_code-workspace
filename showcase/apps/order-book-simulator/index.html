<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Book Matching Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --blue: #63b3ed;
      --yellow: #faca15;
      --font: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    header h1 { font-size: 14px; color: var(--blue); letter-spacing: 1px; white-space: nowrap; }

    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .stat-value { color: var(--text); font-weight: bold; }

    /* ── Main layout ── */
    .main {
      display: grid;
      grid-template-columns: 160px 1fr 200px;
      grid-template-rows: 1fr;
      flex: 1;
      overflow: hidden;
      gap: 1px;
      background: var(--border);
    }

    .panel {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 1px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Right column: chart top, tape bottom ── */
    .right-col {
      display: grid;
      grid-template-rows: 1fr 180px;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }

    /* ── Depth ladder ── */
    .depth-ladder {
      overflow-y: auto;
      flex: 1;
      padding: 2px 0;
    }
    .ladder-header {
      display: flex;
      justify-content: space-between;
      padding: 3px 10px;
      font-size: 10px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ladder-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 10px;
      cursor: default;
    }
    .ladder-row:hover { background: rgba(255,255,255,0.04); }
    .price.ask { color: var(--red); }
    .price.bid { color: var(--green); }
    .qty { color: var(--text); }
    .ladder-spread {
      text-align: center;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--yellow);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    /* ── Trade tape ── */
    .trade-tape {
      overflow-y: auto;
      flex: 1;
      padding: 2px 0;
    }
    .tape-row {
      display: flex;
      gap: 8px;
      padding: 2px 10px;
      font-size: 12px;
      transition: opacity 0.3s;
    }
    .tape-row.buy .tape-price { color: var(--green); }
    .tape-row.sell .tape-price { color: var(--red); }
    .tape-qty { color: var(--muted); min-width: 28px; text-align: right; }
    .tape-side { color: var(--muted); font-size: 10px; }

    /* ── Price chart ── */
    #chart {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Controls sidebar ── */
    .controls {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 220px;
      flex-shrink: 0;
    }

    .ctrl-section { display: flex; flex-direction: column; gap: 6px; }
    .ctrl-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .ctrl-row label { color: var(--muted); font-size: 11px; }

    input[type=number], input[type=text] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 3px 6px;
      width: 60px;
      border-radius: 3px;
    }
    input[type=number]:focus, input[type=text]:focus { outline: none; border-color: var(--blue); }
    input[type=number]:disabled { opacity: 0.4; }

    input[type=range] {
      width: 80px;
      accent-color: var(--blue);
    }

    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 3px 5px;
      border-radius: 3px;
    }

    button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--border); }
    button:disabled { opacity: 0.4; cursor: default; }

    .btn-group { display: flex; gap: 6px; }
    .btn-primary { border-color: var(--green); color: var(--green); }
    .btn-primary:hover:not(:disabled) { background: rgba(63,185,80,0.15); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover:not(:disabled) { background: rgba(248,81,73,0.15); }

    /* ── Leaderboard ── */
    .lb-row {
      display: grid;
      grid-template-columns: 40px 60px 40px 1fr;
      gap: 4px;
      font-size: 11px;
      padding: 2px 4px;
      border-bottom: 1px solid var(--border);
    }
    .lb-type { color: var(--muted); }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* ── Manual order ── */
    #fill-msg {
      font-size: 11px;
      color: var(--yellow);
      transition: opacity 0.5s;
      min-height: 16px;
    }

    /* ── Full layout wrapper ── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 1px;
      background: var(--border);
    }

    .left-panels {
      display: grid;
      grid-template-columns: 160px;
      overflow: hidden;
    }

    .center-panels {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      gap: 1px;
      background: var(--border);
    }

    .chart-panel { flex: 1; overflow: hidden; }
    .tape-panel { height: 180px; overflow: hidden; }

    @media (max-width: 900px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>◈ ORDER BOOK SIMULATOR</h1>
  <div class="stats">
    <div class="stat"><span class="stat-label">Mid</span><span class="stat-value" id="stat-mid">—</span></div>
    <div class="stat"><span class="stat-label">Spread</span><span class="stat-value" id="stat-spread">—</span></div>
    <div class="stat"><span class="stat-label">Last</span><span class="stat-value" id="stat-last">—</span></div>
    <div class="stat"><span class="stat-label">Volume</span><span class="stat-value" id="stat-vol">0</span></div>
    <div class="stat"><span class="stat-label">Orders</span><span class="stat-value" id="stat-orders">0</span></div>
    <div class="stat"><span class="stat-label">Tick</span><span class="stat-value" id="stat-tick">0</span></div>
  </div>
</header>

<div class="app-body">

  <!-- Left: depth ladder -->
  <div class="panel" style="width:160px;flex-shrink:0;">
    <div class="panel-title">Depth Ladder</div>
    <div id="ladder"></div>
  </div>

  <!-- Center: chart + tape -->
  <div class="center-panels">
    <div class="panel chart-panel">
      <div class="panel-title">Price Chart</div>
      <canvas id="chart"></canvas>
    </div>
    <div class="panel tape-panel">
      <div class="panel-title">Trade Tape</div>
      <div id="tape"></div>
    </div>
  </div>

  <!-- Right: controls -->
  <div class="controls">

    <!-- Playback -->
    <div class="ctrl-section">
      <div class="ctrl-title">Playback</div>
      <div class="btn-group">
        <button id="btn-play" class="btn-primary">▶ Play</button>
        <button id="btn-pause" disabled>⏸ Pause</button>
      </div>
      <div class="ctrl-row">
        <label>Speed</label>
        <input type="range" id="ctrl-speed" min="0" max="4" value="2" />
        <span id="speed-label" style="color:var(--blue);font-size:11px;min-width:28px;">2×</span>
      </div>
      <div class="ctrl-row">
        <label>Seed</label>
        <input type="number" id="ctrl-seed" value="42" min="1" />
      </div>
      <button id="btn-reset" class="btn-danger" style="width:100%">↺ Reset</button>
    </div>

    <!-- Agent population -->
    <div class="ctrl-section">
      <div class="ctrl-title">Agent Population</div>
      <div class="ctrl-row"><label>Makers</label><input type="number" id="ctrl-makers" value="3" min="0" max="20" /></div>
      <div class="ctrl-row"><label>Noise</label><input type="number" id="ctrl-noise" value="5" min="0" max="30" /></div>
      <div class="ctrl-row"><label>Momentum</label><input type="number" id="ctrl-momentum" value="2" min="0" max="20" /></div>
      <div class="ctrl-row"><label>Reversion</label><input type="number" id="ctrl-reversion" value="2" min="0" max="20" /></div>
      <div class="ctrl-row"><label>Value</label><input type="number" id="ctrl-value" value="2" min="0" max="20" /></div>
      <button id="btn-apply-agents" style="width:100%;margin-top:4px;">Apply</button>
    </div>

    <!-- Manual order entry -->
    <div class="ctrl-section">
      <div class="ctrl-title">Manual Order</div>
      <div class="ctrl-row">
        <label>Side</label>
        <select id="order-side">
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
        </select>
      </div>
      <div class="ctrl-row">
        <label>Type</label>
        <select id="order-type">
          <option value="limit">Limit</option>
          <option value="market">Market</option>
        </select>
      </div>
      <div class="ctrl-row">
        <label>Price</label>
        <input type="number" id="order-price" value="100" min="0.01" step="0.5" />
      </div>
      <div class="ctrl-row">
        <label>Qty</label>
        <input type="number" id="order-qty" value="10" min="1" />
      </div>
      <button id="order-submit" class="btn-primary" style="width:100%;">Submit Order</button>
      <div id="fill-msg"></div>
    </div>

    <!-- Agent leaderboard -->
    <div class="ctrl-section">
      <div class="ctrl-title">Agent P&amp;L</div>
      <div class="lb-row" style="font-size:10px;color:var(--muted);border:none">
        <span>ID</span><span>Type</span><span>Inv</span><span>P&L</span>
      </div>
      <div id="leaderboard"></div>
    </div>

  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
