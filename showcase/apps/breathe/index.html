<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breathe</title>
  <meta name="description" content="Guided breathing exercises" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23b6ff3d' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%23b6ff3d'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Breathe</h1>
      <p class="subtitle">A moment of calm, whenever you need it</p>
    </header>

    <div class="technique-selector">
      <button class="technique-btn active" data-technique="box">Box Breathing</button>
      <button class="technique-btn" data-technique="478">4-7-8</button>
      <button class="technique-btn" data-technique="sigh">Physiological Sigh</button>
    </div>

    <div class="orb-container">
      <div class="orb-ring outer"></div>
      <div class="orb-ring middle"></div>
      <div class="orb" id="orb"></div>
      <div class="orb-label">
        <div class="phase-text" id="phaseText">Ready</div>
        <div class="countdown" id="countdown"></div>
      </div>
    </div>

    <div class="round-display" id="roundDisplay">Round — of —</div>

    <div class="controls">
      <div class="rounds-selector">
        <span class="rounds-label">Rounds:</span>
        <button class="round-btn active" data-rounds="3">3</button>
        <button class="round-btn" data-rounds="5">5</button>
        <button class="round-btn" data-rounds="10">10</button>
      </div>
      <button class="start-btn" id="startBtn">Start</button>
    </div>

    <div class="technique-info" id="techniqueInfo"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
