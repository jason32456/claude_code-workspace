<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Life</title>
  <meta name="description" content="Emergent particle simulation">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%2325e6ff' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%2325e6ff'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<div id="panel">
  <h1>Particle Life</h1>

  <div class="btn-row">
    <button id="btn-pause">Pause</button>
    <button id="btn-randomize">Randomize Rules</button>
    <button id="btn-respawn">Respawn</button>
  </div>

  <div>
    <p class="section-label">Parameters</p>
    <div id="ctrl-sliders"></div>
  </div>

  <div id="matrix-wrap">
    <p class="section-label">Interaction Matrix</p>
    <p id="matrix-hint">Drag cells up/down &nbsp;·&nbsp; <span style="color:#c04040">■</span> attract &nbsp; <span style="color:#4040c0">■</span> repel</p>
    <div id="matrix-grid"></div>
  </div>

  <div id="hud">
    <span id="hud-fps">— fps</span>
    <span id="hud-count">— particles</span>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
