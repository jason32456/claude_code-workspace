<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Streaks — a minimal, beautiful habit tracker. Build daily habits and watch your streaks grow." />
  <title>Streaks — Habit Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23b6ff3d' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%23b6ff3d'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Streaks</h1>
      <p class="subtitle">Build habits one day at a time</p>
    </header>

    <div id="habits-grid" class="habits-grid"></div>

    <div id="add-section" class="add-section">
      <button id="add-btn" class="add-btn" aria-label="Add habit">
        <span class="plus">+</span> Add Habit
      </button>
      <div id="add-form" class="add-form hidden">
        <div class="emoji-row" id="emoji-row"></div>
        <div class="input-row">
          <input id="habit-input" type="text" placeholder="e.g. Morning Run" maxlength="30" autocomplete="off" />
          <button id="save-btn" class="save-btn">Add</button>
          <button id="cancel-btn" class="cancel-btn">✕</button>
        </div>
      </div>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">🌱</div>
      <p>No habits yet. Add one to start your streak!</p>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
