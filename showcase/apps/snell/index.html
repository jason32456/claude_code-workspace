<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snell</title>
  <meta name="description" content="One beam of white light crosses your desktop; every browser window is a prism or a mirror" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d1c'/%3E%3Cpath d='M16 6 L26 24 L6 24 Z' fill='none' stroke='%23dfe8ff' stroke-width='1.6'/%3E%3Cpath d='M2 15 L13 15' stroke='%23fff' stroke-width='1.6'/%3E%3Cpath d='M19 16 L31 12 M19 17 L31 17 M19 18 L31 22' stroke='%23ff6a5c' stroke-width='1.2'/%3E%3Cpath d='M19 17 L31 17' stroke='%2362ff95' stroke-width='1.2'/%3E%3Cpath d='M19 18 L31 22' stroke='%23b48cff' stroke-width='1.2'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #04050b; color: #e9f1f7; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: ew-resize; }
    #hud { position: fixed; top: 12px; left: 14px; font-size: 13px; text-shadow: 0 1px 6px #000; pointer-events: none; }
    #hud .mark { font-family: 'Iowan Old Style', Palatino, Georgia, serif; letter-spacing: .3em; color: #dfe8ff; font-size: 15px; }
    #hud .lit { color: rgba(233,241,247,.6); font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
    body.won #hud .lit { color: #9dffb8; }
    #ctrl { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; }
    button { appearance: none; border: 0; border-radius: 999px; height: 30px; padding: 0 12px; font: 560 12.5px ui-sans-serif, system-ui, sans-serif; color: #e9f1f7; background: rgba(12,16,30,.75); box-shadow: inset 0 0 0 1px rgba(233,241,247,.16); cursor: pointer; }
    button:hover { background: rgba(40,48,80,.85); }
    #new { background: #dfe8ff; color: #0a0d1c; box-shadow: none; }
    #hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: min(500px, calc(100% - 300px)); background: rgba(10,13,28,.86); border-radius: 12px; padding: 11px 36px 12px 14px; font-size: 13.5px; line-height: 1.5; box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(233,241,247,.12); }
    #hint .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #b9c8ff; margin-bottom: 3px; }
    #hint-x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; padding: 0; background: transparent; box-shadow: none; font-size: 16px; color: rgba(233,241,247,.6); }
    #win { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); background: rgba(10,13,28,.86); border-radius: 999px; padding: 8px 8px 8px 16px; display: none; align-items: center; gap: 10px; font-size: 13px; box-shadow: inset 0 0 0 1px rgba(157,255,184,.4); }
    body.won #win { display: flex; }
    @media (max-width: 520px) { #prev, #next { display: none; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><div class="mark">snell</div><div class="lv"></div><div class="lit"></div></div>
  <div id="ctrl">
    <button id="new" title="Open another window">+ Window</button>
    <button id="kind" title="Switch this window between prism, mirror and clear glass (M)"><span class="kind"></span></button>
    <button id="prev" aria-label="Previous level">‹</button>
    <button id="next" aria-label="Next level">›</button>
  </div>
  <div id="hint" hidden><div class="k">How it works</div><div class="t"></div><button id="hint-x" aria-label="Dismiss">×</button></div>
  <div id="win"><span>All three sensors lit.</span></div>
  <script type="module" src="snell.js"></script>
</body>
</html>
