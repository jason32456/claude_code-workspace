<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette — Color Generator</title>
  <meta name="description" content="5-swatch color generator" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23ffb13d' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%23ffb13d'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" fill="#f87171"/>
        <circle cx="15" cy="7" r="5" fill="#facc15"/>
        <circle cx="11" cy="14" r="5" fill="#60a5fa"/>
      </svg>
      <span>Palette</span>
    </div>
    <div class="controls">
      <button id="btn-export" class="btn btn-ghost">Export CSS</button>
      <button id="btn-generate" class="btn btn-primary">
        Generate
        <kbd>Space</kbd>
      </button>
    </div>
  </header>

  <main id="swatches"></main>

  <div id="toast" role="alert" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
