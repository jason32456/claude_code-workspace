<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vesper — you are the flock</title>
<meta name="description" content="You are not a bird in the flock — you are the flock" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d14'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23ff3db5' stroke-opacity='.55'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' font-weight='700' font-size='18' fill='%23ff3db5'%3EV%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="panel count-panel">
      <div class="label">flock</div>
      <div class="count"><span id="count">0</span><span id="delta" class="delta"></span></div>
    </div>
    <div class="panel meters">
      <div class="meter">
        <div class="label">to the roost</div>
        <div class="bar"><i id="progress"></i></div>
      </div>
      <div class="meter">
        <div class="label">light</div>
        <div class="bar light"><i id="light"></i></div>
      </div>
    </div>
    <div class="panel threat" id="threat">
      <div class="label">falcons</div>
      <div id="threat-list"></div>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="panel">
      <div class="label">stamina</div>
      <div class="bar stam"><i id="stamina"></i></div>
    </div>
    <div class="panel density-panel">
      <div class="label">density <span class="key">shift</span></div>
      <div class="bar dens"><i id="density"></i></div>
    </div>
    <div class="panel">
      <div class="label">flash <span class="key">space</span></div>
      <div class="bar flash"><i id="flash"></i></div>
    </div>
  </div>

  <div id="ring"></div>
  <div id="banner"></div>
  <div id="toast"></div>
</div>

<div id="overlay" class="overlay">
  <div class="sheet" id="sheet">
    <h1 class="title">VESPER</h1>
    <p class="sub">You are not a bird in the flock. You are the flock.</p>
    <div class="body" id="sheet-body"></div>
    <div class="actions" id="sheet-actions"></div>
  </div>
</div>

<div id="loading">generating the valley…</div>

<script type="module" src="main.js"></script>
</body>
</html>
